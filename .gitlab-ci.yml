stages:
  - build
  - preflight
  - stage-remote
  - submit
  - collect

variables:
  CI_TOOLS_IMAGE: "registry.access.redhat.com/ubi8/ubi:8.10"
  HPC_SSH_PORT: "22"
  HPC_PREFLIGHT_COMMANDS: "sbatch squeue sacct scancel"
  HPC_WORK_ROOT: "/project/CHANGE_ME/gitlab-runs"
  HPC_CONTAINER: "/approved/containers/CHANGE_ME-hpc-rhel8.10.sif"
  SLURM_TIME: "00:30:00"
  SLURM_NODES: "1"
  SLURM_TASKS: "1"
  SLURM_CPUS: "4"
  SLURM_MEMORY: "4G"
  SLURM_POLL_SECONDS: "15"
  SLURM_WAIT_TIMEOUT_SECONDS: "3600"
  SIM_ARGS: "[]"
  HPC_CLEANUP_ON_SUCCESS: "false"

.hpc-base:
  image: "$CI_TOOLS_IMAGE"
  before_script:
    - dnf -y -q install openssh-clients curl jq >/dev/null
    - chmod +x scripts/*.sh examples/sim slurm/run_sim.slurm
  tags:
    - CHANGE_ME_HPC_NETWORK_RUNNER

build:sim:
  stage: build
  image: "$CI_TOOLS_IMAGE"
  script:
    # Replace this demo copy with your real RHEL 8.10-compatible build.
    - install -D -m 0755 examples/sim build/sim
    - file build/sim || true
  artifacts:
    paths:
      - build/sim
    expire_in: 1 day

hpc:ssh-check:
  extends: .hpc-base
  stage: preflight
  when: manual
  allow_failure: false
  script:
    - scripts/ssh_check.sh

hpc:stage:
  extends: .hpc-base
  stage: stage-remote
  needs:
    - job: build:sim
      artifacts: true
    - job: hpc:ssh-check
  script:
    - scripts/stage_remote.sh
  artifacts:
    reports:
      dotenv: remote.env
    paths:
      - remote.env
    expire_in: 1 day

hpc:submit:
  extends: .hpc-base
  stage: submit
  needs:
    - job: hpc:stage
      artifacts: true
  script:
    - scripts/submit_slurm.sh
  artifacts:
    reports:
      dotenv: job.env
    paths:
      - job.env
    expire_in: 1 day

hpc:collect:
  extends: .hpc-base
  stage: collect
  needs:
    - job: hpc:submit
      artifacts: true
  script:
    - |
      set +e
      scripts/wait_slurm.sh
      wait_rc=$?
      set -e
      scripts/retrieve_results.sh || retrieve_rc=$?
      if [ "${retrieve_rc:-0}" -ne 0 ]; then
        echo "Result retrieval failed" >&2
        exit "$retrieve_rc"
      fi
      exit "$wait_rc"
  artifacts:
    when: always
    paths:
      - results/
      - slurm-status.env
    expire_in: 14 days
